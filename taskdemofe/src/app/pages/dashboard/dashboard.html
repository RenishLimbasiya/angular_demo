<main class="min-h-screen bg-gray-100">
  <div class="mx-auto max-w-7xl px-6 py-10">
    <div class="mb-8 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold text-gray-800">User Management</h1>
        <p class="mt-2 text-gray-500">Manage your users and their information.</p>
      </div>

      <button (click)="openCreateForm()"
        class="rounded-lg bg-blue-600 px-5 py-3 font-medium text-white shadow hover:bg-blue-700">
        + Add New User
      </button>
    </div>

    <app-userstatistics />
    <app-userlist (addUser)="openCreateForm()" (editUser)="openEditForm($event)" />
  </div>

  @if (formOpen()) {
    <app-userform [user]="selectedUser()" (cancel)="closeForm()" (saved)="onSaved()" />
  }
</main>
