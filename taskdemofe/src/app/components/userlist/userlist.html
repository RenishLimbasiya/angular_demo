<!-- User List -->
<div class="bg-white rounded-xl shadow-sm p-6">
  <!-- Table Header -->
  <div class="flex flex-col md:flex-row justify-between gap-4 mb-6">
    <h2 class="text-xl font-bold text-gray-800">User List</h2>

    <div class="flex gap-3">
      <input
        type="text"
        placeholder="Search users..."
        class="border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
      />

      <button class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg text-gray-700">
        Search
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="overflow-x-auto">
    <table class="w-full text-left">
      <thead>
        <tr class="bg-gray-50 text-gray-600 text-sm border-b">
          <th class="px-5 py-4">#</th>
          <th class="px-5 py-4">Name</th>
          <th class="px-5 py-4">Email</th>
          <th class="px-5 py-4">Created At</th>
          <th class="px-5 py-4">Status</th>
          <th class="px-5 py-4 text-center">Actions</th>
        </tr>
      </thead>

      <tbody class="divide-y divide-gray-100">
        @if (users().length > 0) {
          <!-- User 1 -->
          @for (user of users(); track user.id) {
            <tr class="hover:bg-gray-50">
              <td class="px-5 py-4 text-gray-600">{{ user.id }}</td>

              <td class="px-5 py-4 font-medium text-gray-800">{{ user.name }}</td>

              <td class="px-5 py-4 text-gray-600">{{ user.email }}</td>

              <td class="px-5 py-4 text-gray-600">{{ user.createdAt }}</td>

              <td class="px-5 py-4">
                <span
                  class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-medium"
                >
                  Active
                </span>
              </td>

              <td class="px-5 py-4">
                <div class="flex justify-center gap-2">
                  <button
                    class="bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-2 rounded-md text-sm"
                  >
                    View
                  </button>

                  <button
                    class="bg-yellow-100 text-yellow-700 hover:bg-yellow-200 px-3 py-2 rounded-md text-sm"
                  >
                    Edit
                  </button>

                  <button
                    class="bg-red-100 text-red-700 hover:bg-red-200 px-3 py-2 rounded-md text-sm"
                  >
                    Delete
                  </button>
                </div>
              </td>
            </tr>
          }
        } @else {
          <tr>
            <td colspan="6" class="px-5 py-16 text-center">
              <div class="flex flex-col items-center justify-center">
                <!-- Icon -->
                <div
                  class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4"
                >
                  <svg
                    class="w-8 h-8 text-gray-400"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.5"
                      d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
                    />
                  </svg>
                </div>

                <!-- Message -->
                <h3 class="text-lg font-semibold text-gray-800 mb-1">No Records Found</h3>

                <p class="text-sm text-gray-500 mb-5">
                  There are no users available right now. Add a new user to get started.
                </p>

                <!-- Button -->
                <button
                  class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition"
                >
                  + Add New User
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <app-pagination />
</div>
