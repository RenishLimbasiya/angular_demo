<!-- Add User Form -->
<div class="bg-white rounded-xl shadow-sm p-6 mb-8">
  <h2 class="text-xl font-bold text-gray-800 mb-6">Add New User</h2>

  <form>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2"> Full Name </label>

        <input
          type="text"
          placeholder="Enter full name"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2"> Email Address </label>

        <input
          type="email"
          placeholder="Enter email address"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2"> Password </label>

        <input
          type="password"
          placeholder="Enter password"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2"> Confirm Password </label>

        <input
          type="password"
          placeholder="Confirm password"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>
    </div>

    <!-- Buttons -->
    <div class="flex gap-3 mt-6">
      <button
        type="submit"
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium"
      >
        Save User
      </button>

      <button
        type="reset"
        class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-3 rounded-lg font-medium"
      >
        Reset
      </button>
    </div>
  </form>
</div>
